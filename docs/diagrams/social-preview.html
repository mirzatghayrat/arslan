<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0e0f13;}
  svg{display:block;}
  .mono{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;}
  .sans{font-family:"DejaVu Sans",Arial,sans-serif;}
</style></head><body>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6863c"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5227ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#5227ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5227ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9ffc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff9ffc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e6863c" stroke-opacity="0.35" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0e0f13"/>
  <g>
    <path id="gridMinor" d="" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" fill="none"/>
    <path id="gridMajor" d="" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  </g>
  <script>
    (function(){
      let minor='', major='';
      for(let x=0;x<=1280;x+=32){ (x%160? (minor+=`M${x},0V640`) : (major+=`M${x},0V640`)); }
      for(let y=0;y<=640;y+=32){ (y%160? (minor+=`M0,${y}H1280`) : (major+=`M0,${y}H1280`)); }
      document.getElementById('gridMinor').setAttribute('d',minor);
      document.getElementById('gridMajor').setAttribute('d',major);
    })();
  </script>

  <!-- ambient glows -->
  <ellipse cx="1030" cy="180" rx="460" ry="330" fill="url(#glow)"/>
  <ellipse cx="1180" cy="420" rx="300" ry="240" fill="url(#glow2)"/>

  <!-- corner crosshairs -->
  <g stroke="#e6863c" stroke-width="1.5" opacity="0.9">
    <path d="M40,26 V50 M28,38 H52"/><path d="M1240,26 V50 M1228,38 H1252"/>
    <path d="M40,590 V614 M28,602 H52"/><path d="M1240,590 V614 M1228,602 H1252"/>
  </g>

  <!-- header -->
  <circle cx="64" cy="66" r="4" fill="#e6863c"/>
  <text class="mono" x="80" y="71" font-size="13" letter-spacing="3" fill="#e6863c">FIG. 00 — LOCAL AI ORCHESTRATOR</text>
  <text class="mono" x="1216" y="71" font-size="12" letter-spacing="2.5" fill="#6b7280" text-anchor="end">APACHE-2.0 · REV. PRE-V1</text>
  <line x1="60" y1="92" x2="1220" y2="92" stroke="#2a2d35" stroke-width="1"/>

  <!-- wordmark + tagline -->
  <text class="sans" x="62" y="268" font-size="118" font-weight="bold" fill="#ededf0">Arslan</text>
  <text class="sans" x="66" y="330" font-size="28" fill="#b9bec7">An orchestrator drawn like a machine,</text>
  <text class="sans" x="66" y="368" font-size="28" fill="#b9bec7">not a chat box.</text>
  <text class="mono" x="66" y="428" font-size="14" letter-spacing="2.5" fill="#e6863c">ONE HOST, MANY SPAWNS · KERNEL-SANDBOXED · BYOK</text>

  <!-- mini schematic, right -->
  <g>
    <rect x="850" y="170" width="80" height="44" rx="6" fill="#12131a" stroke="#565b66" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text class="mono" x="890" y="196" font-size="12" letter-spacing="1.5" fill="#9aa0ab" text-anchor="middle">YOU</text>
    <line x1="930" y1="192" x2="966" y2="192" stroke="#e6863c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrO)"/>

    <rect x="972" y="152" width="140" height="80" rx="8" fill="#17181f" stroke="#e6863c" stroke-width="1.5"/>
    <rect x="972" y="152" width="140" height="80" rx="8" fill="none" stroke="#e6863c" stroke-opacity="0.22" stroke-width="5"/>
    <text class="mono" x="992" y="180" font-size="11" letter-spacing="2" fill="#e6863c">HOST</text>
    <text class="sans" x="992" y="204" font-size="15" font-weight="bold" fill="#ededf0">Routes</text>

    <line x1="1112" y1="176" x2="1150" y2="164" stroke="#e6863c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
    <line x1="1112" y1="208" x2="1150" y2="220" stroke="#e6863c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrO)"/>

    <rect x="1156" y="142" width="88" height="40" rx="6" fill="#14151b" stroke="#33363f" stroke-width="1.3"/>
    <text class="mono" x="1200" y="166" font-size="10.5" letter-spacing="1" fill="#9aa0ab" text-anchor="middle">SPAWN 01</text>
    <rect x="1156" y="202" width="88" height="40" rx="6" fill="#14151b" stroke="#33363f" stroke-width="1.3"/>
    <text class="mono" x="1200" y="226" font-size="10.5" letter-spacing="1" fill="#9aa0ab" text-anchor="middle">SPAWN 0n</text>

    <line x1="1042" y1="232" x2="1042" y2="284" stroke="#e6863c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
    <rect x="948" y="290" width="200" height="46" rx="6" fill="#12131a" stroke="#33363f" stroke-width="1.3"/>
    <rect x="948" y="290" width="9" height="46" rx="4.5" fill="url(#hatch)"/>
    <text class="mono" x="972" y="317" font-size="10.5" letter-spacing="1.5" fill="#8b919c">SANDBOX · NET OFF</text>
  </g>

  <!-- footer -->
  <line x1="60" y1="548" x2="1220" y2="548" stroke="#2a2d35" stroke-width="1"/>
  <circle cx="64" cy="586" r="3.5" fill="#e6863c"/>
  <text class="mono" x="80" y="591" font-size="13.5" letter-spacing="2" fill="#9aa0ab">github.com/mirzatghayrat/arslan</text>

  <!-- compact spec cells bottom-right -->
  <g class="mono">
    <rect x="856" y="562" width="120" height="46" fill="#12131a" stroke="#33363f" stroke-width="1.1"/>
    <rect x="976" y="562" width="128" height="46" fill="#12131a" stroke="#33363f" stroke-width="1.1"/>
    <rect x="1104" y="562" width="116" height="46" fill="#12131a" stroke="#33363f" stroke-width="1.1"/>
    <text x="868" y="580" fill="#565b66" letter-spacing="1.5" font-size="8.5">KEYS</text>
    <text x="868" y="597" fill="#ededf0" font-size="11">BYOK</text>
    <text x="988" y="580" fill="#565b66" letter-spacing="1.5" font-size="8.5">SANDBOX</text>
    <text x="988" y="597" fill="#ededf0" font-size="11">FAILS CLOSED</text>
    <text x="1116" y="580" fill="#565b66" letter-spacing="1.5" font-size="8.5">PROMOTION</text>
    <text x="1116" y="597" fill="#e6863c" font-size="11">MANUAL ONLY</text>
  </g>
</svg>
</body></html>
