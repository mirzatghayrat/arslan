[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arslan"
version = "0.1.0"
description = "An open-source Meta-Agent that helps non-technical users build domain-specific AI agents through conversation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Arslan Team" },
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
embeddings = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.scripts]
arslan = "arslan.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
