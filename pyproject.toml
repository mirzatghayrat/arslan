[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arslan"
version = "0.1.0"
description = "An open-source Meta-Agent that helps non-technical users build domain-specific AI agents through conversation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Arslan Team" },
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # 🔴 SECURITY FLOOR — do not lower either of these.
    # The SSRF fix (FU-1) connects to a PINNED IP and restores certificate validation by
    # passing the real hostname through httpx's request `extensions` as `sni_hostname`,
    # which httpcore hands to the TLS handshake as `server_hostname`. Lose that and IP
    # pinning silently becomes "accept any certificate this address presents" — an SSRF
    # hole traded for a MITM one.
    # The tests cannot protect this: they drive httpx.MockTransport, which never performs
    # a TLS handshake, so they prove the extension is SENT but not that it is HONOURED.
    # This floor is the only thing holding that half. See
    # server/registry/executors.py::_pinned_request_args.
    "httpx>=0.28",
    "httpcore>=1.0",
    "jinja2>=3.1",
    "rich>=13.0",
    # Pin below fastapi 0.137 / starlette 1.3: starlette 1.3 changed router/route
    # handling such that create_app()'s include_router() registers no routes (the whole
    # API surface silently vanishes). CI installs unpinned, so it drifted to
    # fastapi 0.139 / starlette 1.3.1 and the recap-route test failed there while local
    # (0.136.3 / 1.2.1) passed. Cap until the code is validated against starlette 1.3.
    "fastapi>=0.110,<0.137",
    "starlette<1.3",
    "uvicorn>=0.29",
    # RUNTIME, not a test tool: uvicorn has no WebSocket implementation of
    # its own and imports one lazily BY NAME. Without it every /ws/ upgrade
    # silently degrades to a plain HTTP request — which the SPA catch-all
    # answers with 200 — and the whole chat transport is dead while the
    # server looks healthy. This lived in the `dev` extra until v0.1.7, so
    # no packaged build (0.1.0-0.1.6) could hold a WebSocket at all.
    "websockets>=12.0",
    # RUNTIME since the vision round: a scanned PDF has no text layer, so its
    # pages are rasterised and read by the model. ~7.8 MB, of which 7.2 MB is
    # libpdfium.dylib — ONE nested Mach-O, and build_dmg.sh discovers signing
    # targets with `file -b | grep Mach-O` rather than by extension, so it is
    # covered without touching the signing loop. BSD-3-Clause / Apache-2.0
    # (Google's PDFium), verified at source per the licence rule — this is the
    # library that replaced AGPL pymupdf.
    "pypdfium2>=4.30",
    "trafilatura>=1.12",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "python-multipart>=0.0.18",
    # Core, not OCR-only: python-pptx imports PIL internally
    # (pptx/parts/image.py, pptx/text/layout.py), so `import deck_pptx` raises
    # ModuleNotFoundError without it. It was briefly listed under the `ocr`
    # extra on the mistaken basis that ingest.py:39,61 were its only importers
    # — true of OUR code, false of the dependency graph.
    "pillow>=10.0",
    "mcp>=1.0",
    # RUNTIME, macOS only: the OCR fallback (tier 2) reads text with the
    # system's own Vision framework. pyobjc is BINDINGS — the recogniser is
    # part of macOS, so nothing is downloaded and nothing is borrowed from the
    # user's machine. That is the whole point: the previous OCR path needed a
    # `tesseract` binary that ships with Homebrew and not with us, so in every
    # packaged build it silently produced "" (see the `ocr` extra below).
    #
    # The marker is not optional bookkeeping: pyobjc does not install on Linux
    # or Windows at all, so an unmarked entry would break `uv sync` there.
    # ocr_vision.py answers `unsupported_platform` on those hosts rather than
    # raising on import.
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# OCR is OPT-IN and is NOT in the distributed desktop build (S4.3-a).
#
# Two separate reasons, both load-bearing:
#   1. LICENSE — the previous rasterizer, pymupdf, is AGPL-3.0 (wheel's own
#      dist-info/COPYING: "Dual Licensed - GNU AFFERO GPL 3.0 or Artifex
#      Commercial License"; its PyPI `license` field and classifiers are BOTH
#      EMPTY, so metadata alone reads as "unlicensed"). Shipping it inside a
#      .dmg distributes a combined work and pulls AGPL onto the whole app,
#      which conflicts with our Apache-2.0. Replaced by pypdfium2
#      (BSD-3-Clause / Apache-2.0, Google's PDFium).
#   2. PACKAGING — pytesseract is only a wrapper; the real work is done by a
#      `tesseract` BINARY that is NOT part of Arslan (on a dev Mac it comes
#      from Homebrew). Bundling it would mean signing/notarizing that binary
#      plus its language packs — the highest-cost failure mode in this round.
#
# Both move together on purpose: _ocr_pdf needs rasterize (pypdfium2) AND
# recognize (pytesseract) — shipping either alone yields a component with no
# consumer. PIL is NOT here: it looks OCR-only (ingest.py:39,61 are our only
# direct imports) but python-pptx pulls it in for real work, so it belongs in
# the core dependencies.
#
# ingest.py is deliberately UNCHANGED in shape: its function-level imports and
# `except -> ""` already handle absence. That predates this round.
#
# WHAT v1 CANNOT DO: scanned PDFs (no text layer) and standalone image
# attachments yield no text. Text-layer PDFs (pypdf, BSD), docx, pptx, html,
# txt and md are unaffected. The fix is the vision round (BYOK image input),
# NOT re-adding tesseract — see docs/specs/2026-07-26-s4.3a-packaging.md §9.
ocr = [
    # pypdfium2 moved to the runtime dependencies in the vision round (scanned
    # PDFs are rasterised for the model, not only for OCR). Only the tesseract
    # wrapper is optional now.
    "pytesseract>=0.3",
]
# Build-only: PyInstaller freezes the desktop sidecar (packaging/arslan-server.spec).
# Deliberately NOT in `dev`: every CI run would download it for nothing — only
# the release job needs it.
build = [
    "pyinstaller>=6.10",
    # BUILD-TIME ONLY, never imported at runtime. collect_submodules("mcp")
    # imports every mcp submodule, and mcp/cli/cli.py calls sys.exit(1) at
    # import time when typer is missing — which aborts the whole freeze with a
    # bare SystemExit and no useful message. (openworker hit the same wall:
    # packaging/build_dmg.sh:16-17.)
    "typer>=0.12",
]
server = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.19",
    "cryptography>=42.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "asgi-lifespan>=2.1",
]
embeddings = [
    "fastembed>=0.3",
]

[project.scripts]
arslan = "arslan.cli:main"

# The wheel content is pinned explicitly so the bundled non-.py package data can
# never be silently dropped by a future default change. The ``arslan`` package
# carries data files loaded at runtime via ``Path(__file__).parent``:
#   - seed skill-packs        arslan/spawn/seeds/        (SKILL.md + scripts/)
#   - scaffold templates      arslan/spawn/scaffold/     (incl. skillpack/*.j2)
#   - LLM capability profiles arslan/llm/profiles/*.yaml
#   - requirement tree        arslan/config/*.yaml
#   - official templates      arslan/templates/official/
# Hatchling already includes these by default (they are git-tracked); naming the
# package here makes that guarantee explicit. The top-level ``server/`` package is
# intentionally NOT wheel-packaged — the FastAPI server is Docker-deployed (see
# Dockerfile: it copies server/ + the built SPA and runs ``uvicorn server.main:app``).
[tool.hatch.build.targets.wheel]
packages = ["arslan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120

[tool.ruff]
target-version = "py311"
line-length = 100
