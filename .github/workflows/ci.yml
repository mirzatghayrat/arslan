name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ARSLAN_SECRET_KEY: ci-secret
      ARSLAN_API_TOKEN: ""
      ARSLAN_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Install from the committed uv.lock for reproducible builds — no version
        # drift (unpinned installs previously drifted to fastapi 0.139/starlette 1.3
        # and silently broke routing). --frozen fails if the lock is stale.
        run: uv sync --frozen --extra dev --extra server

      - name: Ruff
        run: .venv/bin/ruff check server/ arslan/ tests/ scripts/

      - name: Pytest
        run: .venv/bin/pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Vitest
        run: node node_modules/vitest/vitest.mjs run

      - name: Build
        run: npm run build
