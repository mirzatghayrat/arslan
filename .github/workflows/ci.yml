name: CI

on:
  # A commit on a branch with an open PR used to run this whole suite TWICE —
  # once for `push` (unqualified: every branch) and once for `pull_request`.
  # They never deduplicate: push and pull_request carry different `github.ref`,
  # so the concurrency group below cancels neither against the other. Scoping
  # push to the long-lived branches keeps direct pushes and merges to them
  # covered, while a PR branch runs the suite exactly once, via pull_request.
  #
  # 🔴 `release/**` MUST stay in both lists. Hotfixes land on release/<version>
  # (docs/sessions.md §7), and release.yml refuses to build a tag unless THIS
  # workflow succeeded on that exact commit ("Require successful CI for this
  # exact source"). Drop release/** and a hotfix PR gets no CI, and a tag on a
  # release-branch commit fails its build. (#330 scoped this to main alone and
  # had exactly that gap.)
  #
  # A branch with no open PR, and a tag push itself, do not trigger this
  # workflow: the tagged commit already ran it on main or release/**.
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ARSLAN_SECRET_KEY: ci-secret
      ARSLAN_API_TOKEN: ""
      ARSLAN_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Must match .python-version (single source of truth). Three
          # different interpreters were once in play at the same time — dev on
          # 3.11, this file on 3.12, the release runner drifting to the
          # system's framework-build 3.14, whose Python.framework cannot pass
          # notarization. Tests must run on the interpreter we ship.
          python-version: "3.11"

      - name: Install dependencies
        env:
          # Version alone is not enough: the macOS runner ships python.org's
          # FRAMEWORK build of 3.11 at /Library/Frameworks, and uv prefers a
          # discovered system interpreter over downloading its own. Run
          # 30206170484 pinned 3.11 and still got the framework build; only
          # forcing uv-managed (python-build-standalone, no framework — the
          # same interpreter dev machines use) removes the ambient variable.
          UV_PYTHON_PREFERENCE: only-managed
        # Install from the committed uv.lock for reproducible builds — no version
        # drift (unpinned installs previously drifted to fastapi 0.139/starlette 1.3
        # and silently broke routing). --frozen fails if the lock is stale.
        # --extra ocr is REQUIRED here even though the packaged desktop build
        # ships without it (S4.3-a): the rasterizer tests use importorskip, so
        # dropping this flag would turn them into silent skips — green CI with
        # the swapped-in rasterizer never exercised. The next step makes that
        # failure loud instead.
        run: uv sync --frozen --extra dev --extra server --extra ocr

      - name: Assert the optional test extras are actually installed
        # importorskip degrades to "skipped", which reads as green. This turns
        # a missing extra into a hard, immediate failure naming the culprit.
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util as u, sys
          missing = [m for m in ("pypdfium2", "pytesseract", "PIL") if not u.find_spec(m)]
          if missing:
              sys.exit(
                  f"::error::optional test deps missing: {missing}. Tests that "
                  "importorskip them would SKIP and CI would be falsely green. "
                  "Restore '--extra ocr' on the install step."
              )
          print("ocr extra present:", "pypdfium2 pytesseract PIL")
          PY

      - name: Ruff
        run: .venv/bin/ruff check server/ arslan/ tests/ scripts/

      - name: Pytest
        # No rerun bridge: the cross-loop SQLite "database is locked" flake was root-fixed
        # (single-loop test harness — see docs/tech-debt/single-loop-sqlite-flake.md, RESOLVED).
        # Any failure is red on the first attempt.
        #
        # -rfEs, and every character is load-bearing. This step used to say -rR
        # with a comment claiming it "prints a short-test summary". R IS NOT A
        # VALID -r CHARACTER (f E s x X p P a A w N are), and pytest does not
        # reject it — it silently accepted the string and printed NO SUMMARY AT
        # ALL. So this log has been hiding two different things:
        #   f/E  the FAILED/ERROR list. An invalid char replaces pytest's own
        #        default of 'fE', so on a red run the summary naming which tests
        #        failed was never printed. That is why chasing intermittent
        #        failures here has meant reading the whole log.
        #   s    the skip list WITH REASONS. Without it, "20 skipped" is a bare
        #        number in a green report, and a test that never runs anywhere
        #        is indistinguishable from one that passes. That is exactly how
        #        the macOS Vision suite went un-executed on every platform: on
        #        Linux it skips, and nothing said so out loud.
        #
        # 🔴 THIS JOB STAYS FULL. Do not add -m "not macos" here, however
        # tempting it looks once a macOS job exists. The macOS-specific tests
        # already skip themselves on Linux via their own skipif, so there is
        # nothing to exclude and nothing to save — a macOS job is a pure FOURTH
        # job, not a split of this one.
        #
        # And the reason it must not be "optimised" that way is concrete:
        # tests/server/test_code_sandbox.py:137 runs in the OTHER direction. It
        # is skipif(darwin) and asserts the NON-macOS fail-closed refusal —
        # run_python must refuse where there is no seatbelt. macOS skips it. So
        # this Linux job is the only place it ever executes, and a
        # -m "not macos" filter would silently drop the one test proving the
        # fail-closed path works. Measured: it is 1 of exactly 1 Linux-only test.
        # Never set ARSLAN_RELEASE_CHECK here: the capability inventory is compared in the release
        # workflow only (C5b); comparing it on every PR brings back the daily regenerate-and-conflict.
        #
        # -n auto --dist loadfile (C6): one pytest-xdist worker per core, each test FILE kept
        # whole on one worker. Same tests, same results: a per-test-id diff of serial vs
        # parallel showed 9748 ids and 0 different outcomes. Every worker is its own process,
        # so tests/conftest.py pins each one to its own ARSLAN_DATA_DIR (a fresh mkdtemp).
        # Parallel runs saturate the runner's cores, where serial used one, so a test that
        # times itself against the wall clock has less slack here than it used to.
        # No --cov on this step: under coverage, test_osascript_once's 2 s alarm goes flaky,
        # and coverage's fast core needs Python >= 3.12 (deferred to v0.1.64).
        #
        # TMPDIR on the runner's disk, not /tmp: this image mounts /tmp as a tmpfs of a few GiB,
        # and pytest keeps every test's tmp_path there until the session ends. Measured
        # 2026-10-28: 4.28 GiB free mid-run (85.91 GiB on /), under checkpoints.MIN_FREE, so
        # S3's saves were skipped as low_disk. The S3 tests also stub free space now; this keeps
        # the rest of the suite off a filling tmpfs. Tests that need a short AF_UNIX path pick
        # /tmp themselves (test_hands_p0.py, test_command_sandbox.py).
        env:
          TMPDIR: ${{ runner.temp }}
        run: .venv/bin/pytest tests/ -q -rfEs -n auto --dist loadfile

      # ── 0.1.53 Arslan Hands: the contract and the supply chain, on Linux ────
      # The helper's Rust tests read the same fixtures pytest just read
      # (tests/fixtures/hands_contract): the command line built for each request,
      # the never-list, refs bound to their app, password fields, Stop. They run
      # on Linux by design — no Accessibility involved — inside this required job.
      - name: Hands helper tests (contract, server)
        run: cargo test --locked --manifest-path desktop/hands/Cargo.toml

      - name: Hands — read the agent-desktop pin
        id: pin
        run: |
          set -euo pipefail
          grep -E '^(REPOSITORY|COMMIT)=' packaging/hands/agent-desktop.pin \
            | sed -e 's/^REPOSITORY=/repository=/' -e 's/^COMMIT=/commit=/' >> "$GITHUB_OUTPUT"

      - name: Hands — check out agent-desktop at the pin
        uses: actions/checkout@v4
        with:
          repository: mirzatghayrat/agent-desktop
          ref: ${{ steps.pin.outputs.commit }}
          path: third_party/agent-desktop
          fetch-depth: 1

      - name: Hands — the checkout is exactly the pin
        run: test "$(git -C third_party/agent-desktop rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - name: Hands — every vendored file is in the pinned commit (cargo checksums each one)
        # The offline build from a clean fetch runs only in a release; this catches a
        # vendored file git never received (measured: an ignore rule dropped two) here.
        run: python3 scripts/verify_vendored_checksums.py third_party/agent-desktop/vendor

      - name: Hands — cargo-deny on agent-desktop (licenses, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: third_party/agent-desktop/Cargo.toml

      - name: Hands — cargo-deny on the helper
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: desktop/hands/Cargo.toml

  # ---------------------------------------------------------------------------
  # The platform Arslan actually ships on.
  # ---------------------------------------------------------------------------
  # Until 2026-08-06 no CI job had ever run pytest on macOS: all the other jobs
  # here are ubuntu-latest, and release.yml's macos-latest job builds the dmg
  # without running tests. A two-platform skip-list comparison found 25 tests
  # that skip on Linux and had therefore executed NOWHERE — 15 of them seatbelt
  # sandbox tests, including three that prove the kernel denies a
  # chmod-then-write and chmod-then-unlink escape. Arslan's admission model
  # grades capabilities by escapability, and that grading rested on a premise no
  # machine had ever checked.
  #
  # This job is PURELY ADDITIVE. It does not split the backend job — see the
  # comment on that job's Pytest step for why filtering it would silently drop
  # the one Linux-only test.
  macos:
    runs-on: macos-latest
    env:
      ARSLAN_SECRET_KEY: ci-secret
      ARSLAN_API_TOKEN: ""
      ARSLAN_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      - name: Swift helpers typecheck
        # The two voice helpers are compiled only by build_dmg.sh on a tag
        # push. A syntax error in either would surface at release time, after
        # every other check had passed. Typecheck is seconds; it is not a
        # runtime test (that needs a microphone and TCC — see the V2 spec §8).
        run: |
          for f in packaging/listen/*.swift; do
            swiftc -typecheck "$f"
          done

      - name: Arslan Bridge builds and self-tests
        # The iPhone companion helper (desktop/bridge). Unsigned here; the release
        # build signs and notarizes it, and fresh_install_check checks what shipped.
        # Built into binaries/ so tauri.conf.json's macOS.files path exists for the
        # Rust steps below.
        run: |
          packaging/build_bridge.sh desktop/src-tauri/binaries/bridge 0.0.0-ci
          # The shared protocol vectors from the Mac side (the iOS CI runs the same files).
          swift test --package-path desktop/bridge

      - name: Arslan Bridge under ThreadSanitizer
        # BRG1 (#657): the Bridge's loops (the store poll, the held progress lines, the status snapshot, the
        # sweep) and a phone's hello reach shared state from several tasks at once. A data race there repeated a
        # `seq` the phone then dropped as a replay, or crashed the Bridge. The concurrency tests only prove the
        # locks under TSan, and halt_on_error makes any race fail the build. A deadlock fails it in 10 minutes,
        # not the job's 6 hours.
        timeout-minutes: 10
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: swift test --sanitize=thread --package-path desktop/bridge

      # ── Rust: the desktop shell, checked at last ─────────────────────────────
      # lib.rs owns the window, the updater, and the sidecar lifecycle — the
      # exact layer every packaged-only defect has lived in — and until this
      # step nothing compiled it outside a tag push. fmt/clippy live in THIS
      # job because macos is already a required check on main, so a warning
      # blocks a merge without touching the ruleset; and macOS is the platform
      # the shell actually ships on.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/hands
      - name: Rust format
        run: |
          cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
          cargo fmt --check --manifest-path desktop/hands/Cargo.toml
      - name: Hands helper on macOS (the peer-check and Accessibility code paths)
        run: |
          cargo clippy --locked --manifest-path desktop/hands/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop/hands/Cargo.toml
      - name: Rust tests
        # 🔴 The crate had tests BEFORE it had a test step — the DMG-detection
        # module sat here unexecuted, and a test that never runs looks exactly
        # like a test that passes. (PR #23 claimed "the crate has no tests yet";
        # that was wrong, and this step is the correction.)
        run: |
          mkdir -p desktop/src-tauri/binaries/sidecar desktop/src-tauri/binaries/listen desktop/src-tauri/binaries/hands
          cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Rust clippy
        # tauri-build refuses to run when the bundled sidecar resource path is
        # absent; it is a PyInstaller artefact that only exists on a release
        # build. An empty directory satisfies the existence check — clippy
        # compiles the shell, it does not bundle it.
        run: |
          mkdir -p desktop/src-tauri/binaries/sidecar desktop/src-tauri/binaries/listen desktop/src-tauri/binaries/hands
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          # The macOS runner ships python.org's FRAMEWORK build of 3.11 and uv
          # prefers a discovered system interpreter over downloading its own.
          # Same reason as the backend job and release.yml.
          UV_PYTHON_PREFERENCE: only-managed
        # NO --extra ocr here, unlike the backend job, and the difference is the
        # point. pyproject.toml says of that extra: "SUPERSEDED ON macOS (OCR
        # fallback round, decision ④A). This extra is now for LINUX AND SOURCE
        # INSTALLS ONLY" — the desktop build reads images and scanned PDFs with
        # the system's own Vision framework and never reaches pytesseract. The
        # shipped dmg does not contain it.
        #
        # So installing it here would test a configuration no macOS user has, and
        # would let a test quietly depend on tesseract while the real product
        # cannot. Checked before removing: of the 25 selected tests, none touch
        # pytesseract — the two importorskip("pytesseract") tests in
        # test_extract_api.py are test_a_host_without_vision_still_uses_the_tesseract_path
        # and test_extract_image_upload_no_text_200, neither of which carries the
        # macos marker. The Linux job keeps the extra and covers them.
        run: uv sync --frozen --extra dev --extra server

      - name: Assert the macOS-native bindings are present
        # These are declared runtime dependencies (pyobjc-framework-Vision is
        # marked sys_platform == 'darwin'), and their absence is exactly what
        # makes the tests below SKIP rather than fail. A stale local venv
        # missing them once read as a platform difference for an entire round.
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util as u, sys
          missing = [m for m in ("Vision", "Foundation", "pypdfium2") if not u.find_spec(m)]
          if missing:
              sys.exit(
                  f"::error::macOS-native deps missing: {missing}. The macos-marked "
                  "tests would SKIP and this job would be falsely green — the very "
                  "failure it exists to end."
              )
          print("macOS bindings present: Vision Foundation pypdfium2")
          PY

      - name: Pytest (macOS-only set)
        # -m macos selects the marked set. The marker is additive: each of those
        # tests still carries its own skip, which is why they stay green on Linux.
        # -o xfail_strict=true: SBX's p tests for a surface not built yet are strict
        # xfails, and JUnit doesn't record strictness, so every xfail is made strict here.
        # -rfEsx: the x lists each xfail in the log, so the pinned count below can be read.
        run: .venv/bin/pytest tests/ -m macos -q -rfEsx -o xfail_strict=true --junitxml=macos-results.xml

      - name: Assert they RAN, and did not skip
        # 🔴 THE LOAD-BEARING STEP. pytest exits 0 when every selected test is
        # skipped, so without this the job would go green on a runner that lacks
        # Vision or refuses seatbelt — reproducing, on the new platform, the
        # exact "a skip reads as a pass" failure that motivated the whole job.
        #
        # The expected count is established by measurement rather than preference
        # (see tests/server/test_macos_marker_covers_the_platform_set.py).
        # If it legitimately changes, re-run the two-platform comparison and move
        # this number with the evidence — do not tune it to whatever CI reports.
        #
        # 🔴 THE NUMBER LIVES IN TWO PLACES: here, and EXPECTED_TOTAL in that test
        # file. Updating only the test makes the suite green locally and fails
        # here; updating only this one hides drift from the guard that exists to
        # catch it. Change both, in the same commit, or neither.
        #    25 → 28 (2026-08-21, P3b): three seatbelt facts for the ssh
        #    transport — the shipped profile is accepted, a per-host profile is
        #    rejected, and the port confinement actually enforces.
        run: |
          .venv/bin/python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          # 48 real macOS cases (0.1.51: +6 run_command workspace sandbox; 0.1.50: +2 run_command offline mode; 0.1.48: −4 with the unused command sandbox):
          # includes restricted recovery trial, file-denial attacks, durable export, and the fixed isolated
          # artifact parser (2026-09-15). MIRRORS EXPECTED_TOTAL in
          # tests/server/test_macos_marker_covers_the_platform_set.py — a test there now fails if they differ.
          # 0.1.63 D4 follow-up: +1, osacompile confirms an AppleScript syntax error without running it.
          # 0.1.64 SBX-1b: +9, non-ASCII and control-character paths under real seatbelt.
          # 0.1.64 SBX-2 (#507): +293, the default-deny base, its macOS corpus and three localhost measurements.
          # 0.1.64 SBX-2 follow-up (#574): +2, compile checks that the TCP port denies on a fixed port list survive in the proxy and port-22 modes.
          # 0.1.64 SBX-3p (#619): +56, the commands base's denial cases, strict xfails until SBX-3a's product adapter exists.
          # 0.1.64 L11-3a/3d (#621): +1, a rules file's path through macOS's /var link refused, its real path written.
          # 0.1.64 SBX-3a gates (#645, Codex): +13, the measured service allowlist (+12) and the multiprocessing diagnosis (+1).
          # 0.1.64 SBX-3a gates (#645, Codex): +16, any-declared mode added to #619's two commands tests, strict xfails.
          # 0.1.64 SBX-3a gates review round (#645, Codex): −17. The keychain gate's list drops four services that don't exist on macOS and swaps securityd for the live SecurityServer and securityd.xpc (−3 per mode: −12 in the SBX-2 kernel tests, −9 strict xfails in the commands tests); complete-list pins and the raw-UDP gate add +4.
          # 0.1.64 SBX-3a: +1, the work folder, the narrowed devices and a pty still work.
          # 0.1.64 SBX-3a §1a: +1, a sandboxed command writes its own run's TMPDIR.
          # 0.1.64 SBX-3a flip: +1, a work folder inside a closed folder and a saved copy still work on the default-deny base.
          # 0.1.64 SBX-4a: +1, Python still computes and an MCP server still starts on the shared base.
          # 0.1.64 SBX-5a: +1, a sandboxed tool writes the cache its variable names (Arslan's own).
          EXPECTED = 438
          # The strict xfails (SBX's p tests for a surface not built yet) are pinned too. Counting them as
          # ran is not enough: an adapter registered under the wrong key keeps every one xfailing and the
          # job green (#620 review). The PR that builds the surface moves this down with its evidence;
          # a new p PR moves it up.
          # 0.1.64 SBX-3p (#619): 56, all in tests/server/sbx/test_sbx3_commands.py; SBX-3a takes it to 0.
          # 0.1.64 SBX-3a gates (#645, Codex): 72, the 56 plus 16 any-declared cases in the commands tests.
          # 0.1.64 SBX-3a gates review round (#645): 63, after the keychain gate's list shrank by 3 services in each of the 3 commands modes.
          # 0.1.64 SBX-3a flip: 0. The commands adapter is registered, and all 63 pass on the product preset.
          EXPECTED_XFAIL = 0
          suite = ET.parse("macos-results.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          # A strict xfail that failed as expected (SBX's p tests before Na lands) is
          # <skipped type="pytest.xfail">: it ran, so it counts as ran, not as a skip.
          # A strict xfail that passed is a <failure>. How many there are is pinned (EXPECTED_XFAIL).
          xfailed = sum(1 for s in suite.iter("skipped") if s.get("type") == "pytest.xfail")
          skipped = int(suite.get("skipped", 0)) - xfailed
          failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"collected={total} skipped={skipped} xfailed={xfailed} failed={failures}")
          problems = []
          if skipped:
              problems.append(f"{skipped} of {total} SKIPPED — a skip here is a silent pass")
          if total - skipped != EXPECTED:
              problems.append(f"{total - skipped} tests actually ran, expected {EXPECTED}")
          if xfailed != EXPECTED_XFAIL:
              problems.append(f"{xfailed} strict xfails, expected {EXPECTED_XFAIL}: a surface was built, or a "
                              "gate's failure was absorbed, without moving the number")
          if failures:
              problems.append(f"{failures} failed/errored")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          print(f"all {EXPECTED} macOS-only tests executed on the shipping platform")
          PY

  secrets:
    # FULL-HISTORY secret scan, not a diff scan.
    #
    # `gitleaks protect` only looks at uncommitted or newly-pushed changes. A
    # secret that slipped in once is invisible to it from the next commit
    # onward — and "a signing certificate was once committed" is exactly the
    # accident this repository has to catch, since S4.3-a puts Apple signing
    # material into the release path. `detect` re-scans all 1000+ commits every
    # run: slower, and the only mode that can answer the question.
    #
    # This is also the ONLY generic-secret detection this repository has.
    # GitHub's non-provider-pattern scanning requires an organization-owned
    # repo on GitHub Team with Secret Protection; this one is personal, so the
    # setting is silently ignored (the API accepts an invalid value with a 200
    # and changes nothing). See SECURITY.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # detect needs the whole history; the default shallow clone would
          # make this pass by scanning almost nothing.
          fetch-depth: 0

      - name: Install gitleaks
        # The binary, not gitleaks/gitleaks-action. An action is a moving tag
        # by convention, and a scanner that reads the entire repository is a
        # poor place to accept "whatever v2 points at today". A pinned release
        # is one line and depends on nothing but GitHub's own download host.
        #
        # Pinned to the version this repository's baseline was established
        # with; a bump is a deliberate edit, and re-running the scan is how it
        # gets validated.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (all history)
        # Non-zero exit on any finding; --redact keeps the secret itself out of
        # the log, which is public on this repository.
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml

  language:
    # LANG1 (docs/sessions.md §6, user 2026-10-28): everything written to
    # GitHub is English. A DIFF check, unlike `secrets` above: about 250 files
    # on main hold Chinese written before the rule, and that text is not
    # rewritten, so only the lines this change adds are read. The exceptions
    # and the escape hatch (.github/lang-check-allow.txt or a
    # `lang-check: allow` marker) are in scripts/check_added_chinese.py.
    # Commit messages and PR text are not checked.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be in the clone for `git diff base...HEAD`.
          fetch-depth: 0

      - name: No new Chinese outside the exceptions (added lines only)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            # HEAD is GitHub's test merge; its first parent is the base tip it
            # merged onto. Not pull_request.base.sha: that can be an older base
            # tip, and the diff would then blame this PR for commits on main.
            BASE=$(git rev-parse HEAD^1)
          else
            BASE="$BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "no earlier commit to diff against (a new branch); nothing to check"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # A force-push: the commit it replaced is not in the clone. The
            # pull request that brought these lines was checked already.
            echo "::notice::$BASE is not in the clone (force-push?); nothing to check"
            exit 0
          fi
          TMP="${RUNNER_TEMP:-$(mktemp -d)}"
          if git cat-file -e "$BASE:scripts/check_added_chinese.py" 2>/dev/null; then
            # First the BASE commit's checker and allowlist, so a change cannot
            # loosen the check it is judged by. A new exception or allowlist
            # entry lands in its own PR, before the Chinese it allows.
            git show "$BASE:scripts/check_added_chinese.py" > "$TMP/check_base.py"
            git show "$BASE:.github/lang-check-allow.txt" > "$TMP/allow_base.txt" 2>/dev/null || : > "$TMP/allow_base.txt"
            echo "== the base commit's checker and allowlist"
            python3 "$TMP/check_base.py" --base "$BASE" --head HEAD --allowlist "$TMP/allow_base.txt"
          fi
          echo "== this change's checker and allowlist"
          python3 scripts/check_added_chinese.py --base "$BASE" --head HEAD

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Vitest
        run: node node_modules/vitest/vitest.mjs run

      - name: Build
        run: npm run build
