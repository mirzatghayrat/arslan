name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ARSLAN_SECRET_KEY: ci-secret
      ARSLAN_API_TOKEN: ""
      ARSLAN_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Must match .python-version (single source of truth). Three
          # different interpreters were once in play at the same time — dev on
          # 3.11, this file on 3.12, the release runner drifting to the
          # system's framework-build 3.14, whose Python.framework cannot pass
          # notarization. Tests must run on the interpreter we ship.
          python-version: "3.11"

      - name: Install dependencies
        env:
          # Version alone is not enough: the macOS runner ships python.org's
          # FRAMEWORK build of 3.11 at /Library/Frameworks, and uv prefers a
          # discovered system interpreter over downloading its own. Run
          # 30206170484 pinned 3.11 and still got the framework build; only
          # forcing uv-managed (python-build-standalone, no framework — the
          # same interpreter dev machines use) removes the ambient variable.
          UV_PYTHON_PREFERENCE: only-managed
        # Install from the committed uv.lock for reproducible builds — no version
        # drift (unpinned installs previously drifted to fastapi 0.139/starlette 1.3
        # and silently broke routing). --frozen fails if the lock is stale.
        # --extra ocr is REQUIRED here even though the packaged desktop build
        # ships without it (S4.3-a): the rasterizer tests use importorskip, so
        # dropping this flag would turn them into silent skips — green CI with
        # the swapped-in rasterizer never exercised. The next step makes that
        # failure loud instead.
        run: uv sync --frozen --extra dev --extra server --extra ocr

      - name: Assert the optional test extras are actually installed
        # importorskip degrades to "skipped", which reads as green. This turns
        # a missing extra into a hard, immediate failure naming the culprit.
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util as u, sys
          missing = [m for m in ("pypdfium2", "pytesseract", "PIL") if not u.find_spec(m)]
          if missing:
              sys.exit(
                  f"::error::optional test deps missing: {missing}. Tests that "
                  "importorskip them would SKIP and CI would be falsely green. "
                  "Restore '--extra ocr' on the install step."
              )
          print("ocr extra present:", "pypdfium2 pytesseract PIL")
          PY

      - name: Ruff
        run: .venv/bin/ruff check server/ arslan/ tests/ scripts/

      - name: Pytest
        # No rerun bridge: the cross-loop SQLite "database is locked" flake was root-fixed
        # (single-loop test harness — see docs/tech-debt/single-loop-sqlite-flake.md, RESOLVED).
        # Any failure is red on the first attempt.
        #
        # -rfEs, and every character is load-bearing. This step used to say -rR
        # with a comment claiming it "prints a short-test summary". R IS NOT A
        # VALID -r CHARACTER (f E s x X p P a A w N are), and pytest does not
        # reject it — it silently accepted the string and printed NO SUMMARY AT
        # ALL. So this log has been hiding two different things:
        #   f/E  the FAILED/ERROR list. An invalid char replaces pytest's own
        #        default of 'fE', so on a red run the summary naming which tests
        #        failed was never printed. That is why chasing intermittent
        #        failures here has meant reading the whole log.
        #   s    the skip list WITH REASONS. Without it, "20 skipped" is a bare
        #        number in a green report, and a test that never runs anywhere
        #        is indistinguishable from one that passes. That is exactly how
        #        the macOS Vision suite went un-executed on every platform: on
        #        Linux it skips, and nothing said so out loud.
        #
        # 🔴 THIS JOB STAYS FULL. Do not add -m "not macos" here, however
        # tempting it looks once a macOS job exists. The macOS-specific tests
        # already skip themselves on Linux via their own skipif, so there is
        # nothing to exclude and nothing to save — a macOS job is a pure FOURTH
        # job, not a split of this one.
        #
        # And the reason it must not be "optimised" that way is concrete:
        # tests/server/test_code_sandbox.py:137 runs in the OTHER direction. It
        # is skipif(darwin) and asserts the NON-macOS fail-closed refusal —
        # run_python must refuse where there is no seatbelt. macOS skips it. So
        # this Linux job is the only place it ever executes, and a
        # -m "not macos" filter would silently drop the one test proving the
        # fail-closed path works. Measured: it is 1 of exactly 1 Linux-only test.
        run: .venv/bin/pytest tests/ -q -rfEs

  # ---------------------------------------------------------------------------
  # The platform Arslan actually ships on.
  # ---------------------------------------------------------------------------
  # Until 2026-08-06 no CI job had ever run pytest on macOS: all the other jobs
  # here are ubuntu-latest, and release.yml's macos-latest job builds the dmg
  # without running tests. A two-platform skip-list comparison found 25 tests
  # that skip on Linux and had therefore executed NOWHERE — 15 of them seatbelt
  # sandbox tests, including three that prove the kernel denies a
  # chmod-then-write and chmod-then-unlink escape. Arslan's admission model
  # grades capabilities by escapability, and that grading rested on a premise no
  # machine had ever checked.
  #
  # This job is PURELY ADDITIVE. It does not split the backend job — see the
  # comment on that job's Pytest step for why filtering it would silently drop
  # the one Linux-only test.
  macos:
    runs-on: macos-latest
    env:
      ARSLAN_SECRET_KEY: ci-secret
      ARSLAN_API_TOKEN: ""
      ARSLAN_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4

      # ── Rust: the desktop shell, checked at last ─────────────────────────────
      # lib.rs owns the window, the updater, and the sidecar lifecycle — the
      # exact layer every packaged-only defect has lived in — and until this
      # step nothing compiled it outside a tag push. fmt/clippy live in THIS
      # job because macos is already a required check on main, so a warning
      # blocks a merge without touching the ruleset; and macOS is the platform
      # the shell actually ships on.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Rust format
        run: cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Rust tests
        # 🔴 The crate had tests BEFORE it had a test step — the DMG-detection
        # module sat here unexecuted, and a test that never runs looks exactly
        # like a test that passes. (PR #23 claimed "the crate has no tests yet";
        # that was wrong, and this step is the correction.)
        run: |
          mkdir -p desktop/src-tauri/binaries/sidecar desktop/src-tauri/binaries/listen
          cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Rust clippy
        # tauri-build refuses to run when the bundled sidecar resource path is
        # absent; it is a PyInstaller artefact that only exists on a release
        # build. An empty directory satisfies the existence check — clippy
        # compiles the shell, it does not bundle it.
        run: |
          mkdir -p desktop/src-tauri/binaries/sidecar desktop/src-tauri/binaries/listen
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          # The macOS runner ships python.org's FRAMEWORK build of 3.11 and uv
          # prefers a discovered system interpreter over downloading its own.
          # Same reason as the backend job and release.yml.
          UV_PYTHON_PREFERENCE: only-managed
        # NO --extra ocr here, unlike the backend job, and the difference is the
        # point. pyproject.toml says of that extra: "SUPERSEDED ON macOS (OCR
        # fallback round, decision ④A). This extra is now for LINUX AND SOURCE
        # INSTALLS ONLY" — the desktop build reads images and scanned PDFs with
        # the system's own Vision framework and never reaches pytesseract. The
        # shipped dmg does not contain it.
        #
        # So installing it here would test a configuration no macOS user has, and
        # would let a test quietly depend on tesseract while the real product
        # cannot. Checked before removing: of the 25 selected tests, none touch
        # pytesseract — the two importorskip("pytesseract") tests in
        # test_extract_api.py are test_a_host_without_vision_still_uses_the_tesseract_path
        # and test_extract_image_upload_no_text_200, neither of which carries the
        # macos marker. The Linux job keeps the extra and covers them.
        run: uv sync --frozen --extra dev --extra server

      - name: Assert the macOS-native bindings are present
        # These are declared runtime dependencies (pyobjc-framework-Vision is
        # marked sys_platform == 'darwin'), and their absence is exactly what
        # makes the tests below SKIP rather than fail. A stale local venv
        # missing them once read as a platform difference for an entire round.
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util as u, sys
          missing = [m for m in ("Vision", "Foundation", "pypdfium2") if not u.find_spec(m)]
          if missing:
              sys.exit(
                  f"::error::macOS-native deps missing: {missing}. The macos-marked "
                  "tests would SKIP and this job would be falsely green — the very "
                  "failure it exists to end."
              )
          print("macOS bindings present: Vision Foundation pypdfium2")
          PY

      - name: Pytest (macOS-only set)
        # -m macos selects the marked set. The marker is additive: each of those
        # tests still carries its own skip, which is why they stay green on Linux.
        run: .venv/bin/pytest tests/ -m macos -q -rfEs --junitxml=macos-results.xml

      - name: Assert they RAN, and did not skip
        # 🔴 THE LOAD-BEARING STEP. pytest exits 0 when every selected test is
        # skipped, so without this the job would go green on a runner that lacks
        # Vision or refuses seatbelt — reproducing, on the new platform, the
        # exact "a skip reads as a pass" failure that motivated the whole job.
        #
        # The expected count is established by measurement rather than preference
        # (see tests/server/test_macos_marker_covers_the_platform_set.py).
        # If it legitimately changes, re-run the two-platform comparison and move
        # this number with the evidence — do not tune it to whatever CI reports.
        #
        # 🔴 THE NUMBER LIVES IN TWO PLACES: here, and EXPECTED_TOTAL in that test
        # file. Updating only the test makes the suite green locally and fails
        # here; updating only this one hides drift from the guard that exists to
        # catch it. Change both, in the same commit, or neither.
        #    25 → 28 (2026-08-21, P3b): three seatbelt facts for the ssh
        #    transport — the shipped profile is accepted, a per-host profile is
        #    rejected, and the port confinement actually enforces.
        run: |
          .venv/bin/python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          EXPECTED = 28
          suite = ET.parse("macos-results.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"collected={total} skipped={skipped} failed={failures}")
          problems = []
          if skipped:
              problems.append(f"{skipped} of {total} SKIPPED — a skip here is a silent pass")
          if total - skipped != EXPECTED:
              problems.append(f"{total - skipped} tests actually ran, expected {EXPECTED}")
          if failures:
              problems.append(f"{failures} failed/errored")
          if problems:
              sys.exit("::error::" + "; ".join(problems))
          print(f"all {EXPECTED} macOS-only tests executed on the shipping platform")
          PY

  secrets:
    # FULL-HISTORY secret scan, not a diff scan.
    #
    # `gitleaks protect` only looks at uncommitted or newly-pushed changes. A
    # secret that slipped in once is invisible to it from the next commit
    # onward — and "a signing certificate was once committed" is exactly the
    # accident this repository has to catch, since S4.3-a puts Apple signing
    # material into the release path. `detect` re-scans all 1000+ commits every
    # run: slower, and the only mode that can answer the question.
    #
    # This is also the ONLY generic-secret detection this repository has.
    # GitHub's non-provider-pattern scanning requires an organization-owned
    # repo on GitHub Team with Secret Protection; this one is personal, so the
    # setting is silently ignored (the API accepts an invalid value with a 200
    # and changes nothing). See SECURITY.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # detect needs the whole history; the default shallow clone would
          # make this pass by scanning almost nothing.
          fetch-depth: 0

      - name: Install gitleaks
        # The binary, not gitleaks/gitleaks-action. An action is a moving tag
        # by convention, and a scanner that reads the entire repository is a
        # poor place to accept "whatever v2 points at today". A pinned release
        # is one line and depends on nothing but GitHub's own download host.
        #
        # Pinned to the version this repository's baseline was established
        # with; a bump is a deliberate edit, and re-running the scan is how it
        # gets validated.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (all history)
        # Non-zero exit on any finding; --redact keeps the secret itself out of
        # the log, which is public on this repository.
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Vitest
        run: node node_modules/vitest/vitest.mjs run

      - name: Build
        run: npm run build
