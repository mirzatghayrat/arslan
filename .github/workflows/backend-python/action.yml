# The backend test environment, shared by ci.yml's `backend` job and nightly-evidence.yml.
#
# A composite action, not a reusable workflow, and the difference is the required check:
# a job that calls a reusable workflow reports as "<job> / <called job>", so `backend`
# would become "backend / ..." and branch protection, which requires `backend`, would
# wait for a check that never reports. A composite action is steps inside the caller's
# own job, so the job and its check keep their names.
#
# It sits in a subdirectory of .github/workflows because GitHub reads workflows only from
# the top level of that directory. It holds shell steps only: tests/test_actions_are_pinned.py
# reads the top-level workflow files, so every third-party action (setup-uv included) stays
# in those files, where the pin check sees it. The caller checks out the repository and
# installs uv first; this needs the checkout to exist and uv on PATH.
name: Backend Python environment
description: uv sync of the locked dev, server and ocr extras, the extras check, and the test env.
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      env:
        # Version alone is not enough: the macOS runner ships python.org's
        # FRAMEWORK build of 3.11 at /Library/Frameworks, and uv prefers a
        # discovered system interpreter over downloading its own. Run
        # 30206170484 pinned 3.11 and still got the framework build; only
        # forcing uv-managed (python-build-standalone, no framework — the
        # same interpreter dev machines use) removes the ambient variable.
        UV_PYTHON_PREFERENCE: only-managed
      # Install from the committed uv.lock for reproducible builds — no version
      # drift (unpinned installs previously drifted to fastapi 0.139/starlette 1.3
      # and silently broke routing). --frozen fails if the lock is stale.
      # --extra ocr is REQUIRED here even though the packaged desktop build
      # ships without it (S4.3-a): the rasterizer tests use importorskip, so
      # dropping this flag would turn them into silent skips — green CI with
      # the swapped-in rasterizer never exercised. The next step makes that
      # failure loud instead.
      run: uv sync --frozen --extra dev --extra server --extra ocr

    - name: Assert the optional test extras are actually installed
      shell: bash
      # importorskip degrades to "skipped", which reads as green. This turns
      # a missing extra into a hard, immediate failure naming the culprit.
      run: |
        .venv/bin/python - <<'PY'
        import importlib.util as u, sys
        missing = [m for m in ("pypdfium2", "pytesseract", "PIL") if not u.find_spec(m)]
        if missing:
            sys.exit(
                f"::error::optional test deps missing: {missing}. Tests that "
                "importorskip them would SKIP and CI would be falsely green. "
                "Restore '--extra ocr' on the install step."
            )
        print("ocr extra present:", "pypdfium2 pytesseract PIL")
        PY

    - name: The test environment, for every later step of the job
      shell: bash
      # The backend job's env block, moved here so both callers get the same values.
      # Steps before this one (checkout, uv, the sync) never read them. TMPDIR is not
      # here: it belongs to each pytest step alone (see ci.yml's Pytest step).
      run: |
        {
          echo "ARSLAN_SECRET_KEY=ci-secret"
          echo "ARSLAN_API_TOKEN="
          echo "ARSLAN_DATA_DIR=data"
        } >> "$GITHUB_ENV"
