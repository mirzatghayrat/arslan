# Validate the Apple signing/notarization secrets WITHOUT revealing them.
#
# Why this exists: a malformed secret fails deep inside a 20-minute signed
# build, with an error that points at codesign or notarytool rather than at
# the secret that is actually wrong. Worse, some failures are silent-ish — a
# truncated APPLE_CERTIFICATE produces "no identity found", which reads like a
# keychain problem.
#
# The concrete near-miss that prompted it: APPLE_CERTIFICATE was pasted from a
# clipboard that turned out to hold 15 bytes instead of the 4349-byte base64,
# and nothing downstream would have said so in those words.
#
# Everything printed here is either a length, a boolean, or a field of the
# PUBLIC half of the certificate. No secret value is ever echoed, and no file
# written here outlives the runner.
#
# Every step runs with `if: always()` so ONE bad secret does not hide the state
# of the other five. The first version of this file did not, and a wrong
# certificate password meant the API-key secrets went unchecked — the same
# "report all failures, not just the first" rule the bundle selftest follows.
#
# Run it from the Actions tab -> "Secrets preflight" -> Run workflow.
name: Secrets preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Signing certificate + password (checked TOGETHER)
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${CERT_B64:-}" ] || fail "APPLE_CERTIFICATE is empty or not set"
          echo "APPLE_CERTIFICATE: ${#CERT_B64} characters"

          # Tolerate the newlines `base64` inserts; reject anything that is not
          # valid base64 at all.
          printf '%s' "$CERT_B64" | tr -d '\n\r' | base64 -d > cert.p12 2>/dev/null \
            || fail "APPLE_CERTIFICATE is not valid base64 — re-run: base64 -i cert.p12 -o out.txt, then paste the FILE's contents"

          size=$(stat -c%s cert.p12)
          echo "decoded to $size bytes"
          # A Developer ID .p12 is a couple of KB. A pasted-wrong-thing is tens
          # of bytes, which is the failure this whole job exists to catch.
          [ "$size" -gt 1000 ] || fail "decoded certificate is only ${size} bytes — that is not a .p12; the secret holds the wrong text"

          # PKCS#12 is DER: it must open with an ASN.1 SEQUENCE (0x30 0x82).
          head -c2 cert.p12 | od -An -tx1 | grep -q '30 82' \
            || fail "decoded bytes are not PKCS#12 (missing ASN.1 SEQUENCE header)"

          # Whitespace is the single most common way a correct password becomes
          # a wrong secret: copying it picks up a trailing newline, and the
          # GitHub UI shows nothing. Report only a BOOLEAN — this repository is
          # public, so its Actions logs are public, and even the password's
          # LENGTH must not be printed here.
          trimmed="$(printf '%s' "$CERT_PASSWORD" | tr -d '[:space:]')"
          if [ "${#trimmed}" -ne "${#CERT_PASSWORD}" ]; then
            echo "::warning::APPLE_CERTIFICATE_PASSWORD contains whitespace — if that was not intentional, it is probably a stray newline from copying"
          else
            echo "password: no stray whitespace"
          fi

          # THE decisive check: open the archive with the password. This is the
          # only test that proves the certificate and the password belong to
          # each other — either being wrong alone fails here.
          #
          # openssl's stderr is SHOWN, not swallowed. An earlier version sent it
          # to /dev/null and therefore reported every failure as "wrong
          # password" — including failures that are nothing of the kind (an
          # unsupported legacy cipher, for one). Diagnosing from a message the
          # tool never printed cost a full round-trip.
          if ! openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -clcerts -out cert.pem; then
            echo "--- retrying with the legacy provider (macOS exports use old PBE ciphers) ---"
            if openssl pkcs12 -legacy -in cert.p12 -passin env:CERT_PASSWORD -nokeys -clcerts -out cert.pem; then
              echo "::warning::the .p12 needs OpenSSL's legacy provider — the build scripts must pass -legacy too"
            else
              fail "APPLE_CERTIFICATE_PASSWORD does not open APPLE_CERTIFICATE — see openssl's own message above for which it is"
            fi
          fi

          echo "--- public half of the certificate (not secret) ---"
          openssl x509 -in cert.pem -noout -subject -issuer -enddate

          # Must be a Developer ID Application cert. "Apple Development" and
          # "Apple Distribution" certificates import fine and then fail at
          # notarization, which is a much more expensive place to find out.
          subject="$(openssl x509 -in cert.pem -noout -subject)"
          case "$subject" in
            *"Developer ID Application"*) echo "type: Developer ID Application — correct for notarized distribution" ;;
            *) fail "wrong certificate type. Notarized distribution needs 'Developer ID Application'; got: $subject" ;;
          esac

          openssl x509 -in cert.pem -noout -checkend 0 \
            || fail "the certificate has EXPIRED"

          # The private key must be in the archive, or nothing can be signed.
          openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nocerts -noout 2>/dev/null \
            || fail "no private key inside the .p12 — re-export from Keychain Access with the key expanded under the certificate"
          echo "private key: present"
          rm -f cert.p12 cert.pem

      - name: Signing identity string
        if: always()
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ -n "${IDENTITY:-}" ] || fail "APPLE_SIGNING_IDENTITY is empty or not set"
          # Shape only — the value itself is a secret and is never printed.
          echo "$IDENTITY" | grep -Eq '^Developer ID Application: .+ \([A-Z0-9]{10}\)$' \
            || fail "APPLE_SIGNING_IDENTITY must look like: Developer ID Application: <Name> (<TEAMID>) — with no surrounding quotes"
          echo "APPLE_SIGNING_IDENTITY: well-formed"

      - name: Notarization API key (skipped until it is set)
        if: always()
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_CONTENT }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ -z "${KEY_B64:-}" ] && [ -z "${KEY_ID:-}" ] && [ -z "${ISSUER:-}" ]; then
            echo "::notice::App Store Connect API key not configured yet — notarization will be skipped by the release build."
            exit 0
          fi
          # Partially-configured is worse than not configured: the build looks
          # ready and fails at the notarize step.
          [ -n "${KEY_B64:-}" ] || fail "APPLE_API_KEY_CONTENT missing while the other API-key secrets are set"
          [ -n "${KEY_ID:-}" ]  || fail "APPLE_API_KEY missing while the other API-key secrets are set"
          [ -n "${ISSUER:-}" ]  || fail "APPLE_API_ISSUER missing while the other API-key secrets are set"

          printf '%s' "$KEY_B64" | tr -d '\n\r' | base64 -d > key.p8 2>/dev/null \
            || fail "APPLE_API_KEY_CONTENT is not valid base64"
          grep -q "BEGIN PRIVATE KEY" key.p8 \
            || fail "APPLE_API_KEY_CONTENT does not decode to a PEM private key — is it the .p8 file?"
          openssl pkey -in key.p8 -noout \
            || fail "the decoded .p8 is not a readable private key"
          echo "APPLE_API_KEY_CONTENT: valid PEM private key"
          rm -f key.p8

          echo "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$' \
            || fail "APPLE_API_KEY should be the 10-character Key ID from the AuthKey_XXXXXXXXXX.p8 filename"
          echo "$ISSUER" | grep -Eiq '^[0-9a-f-]{36}$' \
            || fail "APPLE_API_ISSUER should be the 36-character Issuer UUID"
          echo "APPLE_API_KEY / APPLE_API_ISSUER: well-formed"

      - name: Updater signing key (skipped until it is set)
        if: always()
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_KEY:-}" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY not set — the build will produce no auto-update artifacts."
          else
            echo "TAURI_SIGNING_PRIVATE_KEY: present (${#TAURI_KEY} characters)"
          fi
