[package]
name = "arslan-hands"
version = "0.1.0"
description = "Arslan Hands: the helper app that holds Accessibility and runs agent-desktop for Arslan"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
publish = false

# Kept tiny on purpose: this process holds the Accessibility grant, so every
# dependency is code that runs with it. No async runtime, no networking crates.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
