<!doctype html>
<meta charset="utf-8" />
<title>Arslan</title>
<!--
  Tauri requires a frontendDist, but Arslan's UI is served by the Python
  sidecar (server/main.py mounts the SPA), not bundled into the webview. So
  this page is what the window shows for the second or two between launch and
  the sidecar announcing its port — a deliberate loading state rather than the
  white flash a blank frontendDist would give.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin:0; height:100vh; display:grid; place-items:center;
         font:15px/1.5 -apple-system, system-ui, sans-serif;
         background:#faf9f7; color:#3d3833; }
  @media (prefers-color-scheme: dark) { body { background:#17150f; color:#d9d2c7; } }
  .dot { width:9px; height:9px; border-radius:50%; background:#d97706;
         animation:p 1.1s ease-in-out infinite; }
  @keyframes p { 0%,100%{opacity:.25;transform:scale(.85)} 50%{opacity:1;transform:scale(1)} }
  .row { display:flex; gap:10px; align-items:center; }
  #slow { margin-top:14px; font-size:13px; opacity:.65; visibility:hidden; text-align:center; }
</style>
<div>
  <div class="row"><span class="dot"></span><span>Starting Arslan…</span></div>
  <div id="slow">First launch sets up your database — this can take a moment.</div>
</div>
<script>
  // Only after a delay, so a normal fast start never shows it.
  setTimeout(() => { document.getElementById('slow').style.visibility = 'visible' }, 4000);
</script>
