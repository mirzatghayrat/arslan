<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Arslan</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.65 -apple-system, BlinkMacSystemFont, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: light-dark(#faf9f6, #17150f); color: light-dark(#25231e, #f1ede3); }
  main { box-sizing: border-box; width: min(100%, 720px); padding: 48px 32px; }
  h1 { font-size: clamp(1.3rem, 3vw, 1.85rem); line-height: 1.35; margin: 0 0 24px; overflow-wrap: anywhere; }
  p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .brand { color: light-dark(#87641d, #d4ae5a); letter-spacing: .08em; margin-bottom: 20px; }
</style>
<main aria-live="polite" aria-atomic="true">
  <div class="brand">Arslan</div>
  <h1 id="heading"></h1>
  <p id="detail"></p>
</main>
<script>
  // Bundled, read-only display surface: no network, forms, links or invoke calls.
  window.__arslanRenderRecovery = function () {
    var copy = window.__ARSLAN_RECOVERY_COPY__;
    if (!copy || typeof copy !== 'object') return;
    document.documentElement.lang = String(copy.locale || 'en');
    document.getElementById('heading').textContent = String(copy.heading || '');
    document.getElementById('detail').textContent = String(copy.detail || '');
    document.title = String(copy.heading || 'Arslan');
  };
  window.__arslanRenderRecovery();
</script>
</html>
