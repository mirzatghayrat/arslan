[package]
name = "arslan-desktop"
version = "0.1.0"
description = "Arslan desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri's own layout: the binary is a thin wrapper so the same code can be
# reused by the mobile targets later.
name = "arslan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api pairs with macOSPrivateApi in tauri.conf.json — tauri-build
# refuses to compile when the two disagree, which is how this line got here.
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
# generate_context! expands to code that names serde_json in the crate root, so
# it must be a direct dependency even though none of our own code uses it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-updater = "2"
# Native ask/info dialogs for the update prompt. The UI is a remote page served
# by the sidecar, which gets no Tauri IPC — so the update conversation has to
# happen on the Rust side, and that needs a dialog.
tauri-plugin-dialog = "2"

[profile.release]
# The .dmg carries a 144MB Python sidecar; shaving the Rust side is worth the
# slower build.
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
