<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ spawn_name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; color: white; padding: 1rem 1.5rem; }
    header h1 { font-size: 1.25rem; }
    #chat-container { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .message { max-width: 70%; padding: 0.75rem 1rem; border-radius: 0.75rem; line-height: 1.5; }
    .user { align-self: flex-end; background: #3b82f6; color: white; }
    .agent { align-self: flex-start; background: white; color: #1e293b; border: 1px solid #e2e8f0; }
    #input-area { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; background: white; border-top: 1px solid #e2e8f0; }
    #message-input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1rem; outline: none; }
    #message-input:focus { border-color: #3b82f6; }
    #send-btn { padding: 0.75rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; }
    #send-btn:hover { background: #2563eb; }
    #send-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1 id="spawn-title">{{ spawn_name }}</h1>
  </header>
  <div id="chat-container"></div>
  <div id="input-area">
    <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const container = document.getElementById('chat-container');
    const input = document.getElementById('message-input');
    const btn = document.getElementById('send-btn');

    function appendMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      btn.disabled = true;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        appendMessage(data.reply, 'agent');
      } catch (err) {
        appendMessage('Error: could not reach the agent.', 'agent');
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    btn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
